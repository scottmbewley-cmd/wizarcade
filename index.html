<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WizArcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wordmark">WizArcade</header>

  <main class="tile-grid" id="tile-grid"></main>

  <script>
    // Add a new game by adding one entry here — no other markup changes needed.
    const GAMES = [
      {
        title: "Star Invaders",
        subtitle: "Endless arcade survival — classic formation shooter",
        href: "games/star-invaders/index.html"
      },
      {
        title: "Munch Man",
        subtitle: "Endless maze survival — eat every dot",
        href: "games/munch-man/index.html"
      },
      {
        title: "Slither",
        subtitle: "Nokia-style snake — eat, grow, don't bite yourself",
        href: "games/slither/index.html"
      },
      {
        title: "Ricochet",
        subtitle: "Solo squash-style Pong — endless survival",
        href: "games/ricochet/index.html"
      }
    ];

    const grid = document.getElementById("tile-grid");
    for (const game of GAMES) {
      const a = document.createElement("a");
      a.className = game.test ? "tile tile--test" : "tile";
      a.href = game.href;
      a.innerHTML = `
        <span class="tile-title">${game.title}</span>
        <span class="tile-subtitle">${game.subtitle}</span>
      `;
      grid.appendChild(a);
    }
  </script>
</body>
</html>
