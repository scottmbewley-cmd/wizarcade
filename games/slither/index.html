<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  This page itself (not just game.js/controller.js, which the ?v=N query
  strings below already cache-bust) has repeatedly been served stale from
  some mobile browsers/in-app browsers well after a fresh deploy — with no
  visible sign anything is wrong, since a stale index.html just keeps
  pointing at the OLD ?v=N script URLs it already has baked in. These
  meta tags are a best-effort ask for phone-side caches (that don't
  necessarily honor GitHub Pages' own Cache-Control header the same way a
  desktop browser does) to treat the DOCUMENT itself as never cacheable.
-->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slither — WizArcade</title>
<meta property="og:title" content="Slither">
<meta property="og:description" content="Tap to play — endless snake survival.">
<meta property="og:image" content="https://scottmbewley-cmd.github.io/wizarcade/assets/slither-logo.png">
<meta property="og:url" content="https://scottmbewley-cmd.github.io/wizarcade/games/slither/index.html">
<meta name="twitter:card" content="summary_large_image">
<script>
  // iOS Safari BUG FIX: its address bar shows/hides dynamically as you
  // scroll/interact, and 100vh does NOT reliably track the actually-visible
  // viewport there — it can reflect the viewport as if the chrome were
  // hidden even while it's shown, causing the page to overflow the real
  // visible area (get cut off) with no way to scroll to the rest, since
  // body has overflow:hidden. window.visualViewport tracks the REAL visible
  // size live, so mirror it into CSS custom properties the stylesheet below
  // reads instead of raw vh/vw units. Runs synchronously in <head>, before
  // #page-frame is ever laid out, so there's no flash of wrongly-sized
  // content on first paint. Falls back to 100vh/100vw (via the var()
  // fallback argument in the CSS) on any browser without visualViewport.
  (function () {
    function syncViewportVars() {
      var vv = window.visualViewport;
      var w = vv ? vv.width : window.innerWidth;
      var h = vv ? vv.height : window.innerHeight;
      document.documentElement.style.setProperty("--vvw", w + "px");
      document.documentElement.style.setProperty("--vvh", h + "px");
    }
    syncViewportVars();
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncViewportVars);
      window.visualViewport.addEventListener("scroll", syncViewportVars);
    }
    window.addEventListener("resize", syncViewportVars);
    window.addEventListener("orientationchange", syncViewportVars);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /*
    #page-frame holds the game canvas (#game-container, aspect-locked to
    480:800) stacked above the shared controller.js joystick (position:
    absolute within this element, built by game.js's createController() as
    an adjustable WizController — player-draggable/resizable). #page-frame
    reserves exactly enough room below the canvas to fit the controller's
    actual height without overlap.

    That reserved amount is NOT a static guess: controller.js itself
    publishes the box's real rendered height as the --wiz-ctrl-height
    custom property on #page-frame (its `target`) whenever `adjustable` is
    set, and the max-width/max-height formulas below reference it directly
    via var() — no manual setProperty() call needed on game.js's side.
    The "+ 8px" is the gap between the canvas and the controller box. The
    var()'s ~153px fallback matches createController()'s defaultHeight, for
    the brief instant before controller.js has run its first layout pass.

    Sized against --vvh/--vvw (kept live by window.visualViewport in the
    <script> above) instead of raw 100vh/100vw — see the script's own
    comment for why raw vh is unreliable on iOS Safari.
  */
  #page-frame {
    width: var(--vvw, 100vw);
    height: var(--vvh, 100vh);
    max-width: calc((var(--vvh, 100vh) - (var(--wiz-ctrl-height, 153px) + 8px)) * 480 / 800);
    max-height: calc(var(--vvw, 100vw) * 800 / 480 + var(--wiz-ctrl-height, 153px) + 8px);
  }
  #game-container {
    width: 100%;
    aspect-ratio: 480 / 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div id="page-frame">
    <div id="game-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <!--
    ?v=N cache-busts these two local scripts — GitHub Pages/CDN edge
    caching plus mobile browsers' own aggressive disk caching (Discord's
    in-app browser especially) can otherwise keep serving an old game.js
    well after a fresh deploy, with no visible sign anything is stale.
    Bump v= here any time game.js (or controller.js, if it changes) is
    updated, so returning players are guaranteed the new file instead of
    whatever their browser already has cached under the old URL.
  -->
  <script src="../../controller/controller.js?v=2"></script>
  <script src="game.js?v=2"></script>
</body>
</html>
