<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Test Invaders (Controller Test Build) — WizArcade</title>
<meta property="og:title" content="Star Invaders">
<meta property="og:description" content="Tap to play — endless arcade survival.">
<meta property="og:image" content="https://scottmbewley-cmd.github.io/wizarcade/assets/star-invaders-logo.png">
<meta property="og:url" content="https://scottmbewley-cmd.github.io/wizarcade/games/test-invaders/index.html">
<meta name="twitter:card" content="summary_large_image">
<script>
  // iOS Safari BUG FIX: its address bar shows/hides dynamically as you
  // scroll/interact, and 100vh does NOT reliably track the actually-visible
  // viewport there — it can reflect the viewport as if the chrome were
  // hidden even while it's shown, causing the page to overflow the real
  // visible area (get cut off) with no way to scroll to the rest, since
  // body has overflow:hidden. window.visualViewport tracks the REAL visible
  // size live, so mirror it into CSS custom properties the stylesheet below
  // reads instead of raw vh/vw units. Runs synchronously in <head>, before
  // #page-frame is ever laid out, so there's no flash of wrongly-sized
  // content on first paint. Falls back to 100vh/100vw (via the var()
  // fallback argument in the CSS) on any browser without visualViewport.
  (function () {
    function syncViewportVars() {
      var vv = window.visualViewport;
      var w = vv ? vv.width : window.innerWidth;
      var h = vv ? vv.height : window.innerHeight;
      document.documentElement.style.setProperty("--vvw", w + "px");
      document.documentElement.style.setProperty("--vvh", h + "px");
    }
    syncViewportVars();
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncViewportVars);
      window.visualViewport.addEventListener("scroll", syncViewportVars);
    }
    window.addEventListener("resize", syncViewportVars);
    window.addEventListener("orientationchange", syncViewportVars);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /*
    #page-frame is the WizController's `target` — it holds the game canvas
    (#game-container, aspect-locked to 480:800) stacked above the
    player-draggable/resizable control box (position: absolute within this
    element, sized/capped in game.js's createController()). The box is
    free to be dragged anywhere within #page-frame, including deliberately
    over the canvas — but its AUTOMATIC default/landing position sits just
    below the canvas, so #page-frame reserves exactly enough room below
    the canvas to fit the box's CURRENT actual height without overlap.

    That reserved amount is NOT a static guess: controller.js publishes
    the box's live height as the --wiz-ctrl-height custom property on
    #page-frame itself (see controller.js's _reportHeight(), called on
    every layout change — first paint, loading a saved layout, live
    drag-resize, and window-resize re-clamp), and the max-width/max-height
    formulas below reference it directly via var(). Because a CSS custom
    property change alone triggers a reflow of anything that reads it,
    this stays correct automatically: no polling, no resize-event wiring
    needed here. The "+ 8px" mirrors controller.js's own gap between the
    canvas and the box's default position (_computeDefaultLayout's +8).
    The var()'s 153px fallback matches createController()'s defaultHeight,
    for the brief instant before controller.js has run its first layout
    pass. controller.js sets #page-frame to position:relative itself.

    Sized against --vvh/--vvw (kept live by window.visualViewport in the
    <script> above) instead of raw 100vh/100vw: on iOS Safari the raw vh
    unit does not reliably track the actually-visible area once the address
    bar's show/hide animation is factored in, which is what was cutting the
    page off-screen. The var() fallback (100vh/100vw) only matters on
    browsers with no JS/visualViewport support.
  */
  #page-frame {
    width: var(--vvw, 100vw);
    height: var(--vvh, 100vh);
    max-width: calc((var(--vvh, 100vh) - (var(--wiz-ctrl-height, 153px) + 8px)) * 480 / 800);
    max-height: calc(var(--vvw, 100vw) * 800 / 480 + var(--wiz-ctrl-height, 153px) + 8px);
  }
  #game-container {
    width: 100%;
    aspect-ratio: 480 / 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* TEMP DIAGNOSTIC — safe to delete later */
  #size-readout {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 2px;
    z-index: 99999;
    text-align: center;
    font-family: monospace;
    font-size: 11px;
    color: #ffe066;
    background: rgba(0, 0, 0, 0.6);
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* TEMP DIAGNOSTIC — pointer-event debug overlay, safe to delete later.
     Investigating the touch-only ghost-ship/midpoint-bullet bug — see
     controller.js's _debugLog() and this file's own log-sink script below.
     Sits at the TOP (away from #size-readout at the bottom) so both stay
     independently readable/screenshotable on a real phone. */
  #debug-log {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99998;
    max-height: 34vh;
    overflow: hidden;
    font-family: monospace;
    font-size: 9px;
    line-height: 1.3;
    color: #7cfc9a;
    background: rgba(0, 0, 0, 0.72);
    padding: 2px 4px;
    pointer-events: none;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div id="page-frame">
    <div id="game-container"></div>
  </div>
  <div id="size-readout">measuring…</div>
  <div id="debug-log"></div>
  <script>
    // TEMP DIAGNOSTIC — safe to delete later. Single shared log sink for
    // the touch-only ghost-ship/midpoint-bullet investigation: controller.js
    // calls window.__wizDebugLog() from _onPointerDown/_onPointerMove/
    // _onPointerUp (the steering box's own pointer handling), and the
    // Phaser pointer listeners registered below (in this file, since
    // nothing in game.js itself reads movement from Phaser's input) call
    // it too — both funnel into ONE chronologically-ordered on-screen
    // overlay so it's possible to see, on a real phone with no dev-tools
    // connection, whether Phaser's own parallel mouse/touch input system
    // is doing anything unexpected relative to controller.js's own pointer
    // stream during a steering drag. Defined here, before Phaser/
    // controller.js/game.js load, so the sink exists no matter how early
    // any of them fires. Keeps the last ~15 lines, newest at the bottom.
    (function () {
      var el = document.getElementById("debug-log");
      var lines = [];
      var MAX_LINES = 15;
      window.__wizDebugLog = function (line) {
        var t = performance.now().toFixed(0);
        lines.push("[" + t + "] " + line);
        if (lines.length > MAX_LINES) lines.shift();
        el.textContent = lines.join("\n");
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="../../controller/controller.js"></script>
  <script src="game.js"></script>
  <script>
    // TEMP DIAGNOSTIC — safe to delete later. Polls for the Phaser canvas
    // and controller strip (both created asynchronously by game.js) and
    // reports their actual measured getBoundingClientRect() size. Does
    // not touch or depend on any existing layout/sizing logic.
    (function () {
      var readout = document.getElementById("size-readout");

      function update() {
        var canvas = document.querySelector("#game-container canvas");
        var strip = document.querySelector(".wiz-ctrl");
        // Ghost-ship diagnostic: how many <canvas> elements actually exist
        // in the DOM right now. Should always read 1 — if it's ever >1,
        // more than one Phaser.Game instance/canvas got created, which
        // would fully explain a duplicate-looking ship. Read independently
        // of the canvas/strip guard below so it still reports even before
        // either exists.
        var canvasCount = document.querySelectorAll("canvas").length;
        readout.textContent = "CANVASES: " + canvasCount;

        if (!canvas || !strip) return;

        var c = canvas.getBoundingClientRect();
        var s = strip.getBoundingClientRect();
        var ratio = s.height > 0 ? (s.width / s.height).toFixed(2) : "--";

        // BOX x/y diagnostic — position of the control strip relative to
        // #page-frame (the same coordinate space its saved layout is
        // stored/clamped in), not the viewport. Lets an off-screen/clipped
        // box be confirmed directly instead of inferred from CANVAS/STRIP
        // size alone (which stay non-zero even when the box is fully
        // outside the visible frame).
        var frame = document.getElementById("page-frame");
        var f = frame ? frame.getBoundingClientRect() : null;
        var boxX = f ? Math.round(s.left - f.left) : "?";
        var boxY = f ? Math.round(s.top - f.top) : "?";

        readout.textContent =
          "CANVAS: " + Math.round(c.width) + "x" + Math.round(c.height) + "px" +
          "  |  STRIP: " + Math.round(s.width) + "x" + Math.round(s.height) + "px" +
          "  |  STRIP RATIO: " + ratio +
          "  |  BOX: " + boxX + "," + boxY + " " + Math.round(s.width) + "x" + Math.round(s.height) +
          "  |  CANVASES: " + canvasCount;
      }

      window.addEventListener("load", update);
      window.addEventListener("resize", update);
      setInterval(update, 250); // covers the async canvas/strip creation and any layout settling
    })();
  </script>
</body>
</html>
