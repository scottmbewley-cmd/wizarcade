<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Test Invaders (Controller Test Build) — WizArcade</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /*
    #page-frame is the WizController's `target` — it reserves room for
    both the game canvas (#game-container, aspect-locked to 480:800) AND
    the control box that floats below it (player-adjustable, position:
    absolute within this element, sized/capped in game.js's
    createController()). RESERVE_PX (340, matching the box's max
    possible footprint plus gaps) is folded into BOTH the max-width and
    max-height formulas below, so #page-frame's own box always fits the
    viewport exactly — canvas height + box's reserved space always sums
    to no more than 100vh, on any screen size, with no scrolling needed.
    controller.js sets #page-frame to position:relative itself.
  */
  #page-frame {
    width: 100vw;
    height: 100vh;
    max-width: calc((100vh - 340px) * 480 / 800);
    max-height: calc(100vw * 800 / 480 + 340px);
  }
  #game-container {
    width: 100%;
    aspect-ratio: 480 / 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* TEMP DIAGNOSTIC — safe to delete later */
  #size-readout {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 2px;
    z-index: 99999;
    text-align: center;
    font-family: monospace;
    font-size: 11px;
    color: #ffe066;
    background: rgba(0, 0, 0, 0.6);
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div id="page-frame">
    <div id="game-container"></div>
  </div>
  <div id="size-readout">measuring…</div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="../../controller/controller.js"></script>
  <script src="game.js"></script>
  <script>
    // TEMP DIAGNOSTIC — safe to delete later. Polls for the Phaser canvas
    // and controller strip (both created asynchronously by game.js) and
    // reports their actual measured getBoundingClientRect() size. Does
    // not touch or depend on any existing layout/sizing logic.
    (function () {
      var readout = document.getElementById("size-readout");

      function update() {
        var canvas = document.querySelector("#game-container canvas");
        var strip = document.querySelector(".wiz-ctrl");
        if (!canvas || !strip) return;

        var c = canvas.getBoundingClientRect();
        var s = strip.getBoundingClientRect();
        var ratio = s.height > 0 ? (s.width / s.height).toFixed(2) : "--";

        readout.textContent =
          "CANVAS: " + Math.round(c.width) + "x" + Math.round(c.height) + "px" +
          "  |  STRIP: " + Math.round(s.width) + "x" + Math.round(s.height) + "px" +
          "  |  STRIP RATIO: " + ratio;
      }

      window.addEventListener("load", update);
      window.addEventListener("resize", update);
      setInterval(update, 250); // covers the async canvas/strip creation and any layout settling
    })();
  </script>
</body>
</html>
