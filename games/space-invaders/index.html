<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Invaders — WizArcade</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /*
    Keep the game portrait-shaped (480:800) and centered with
    letterboxing on wide desktop screens instead of stretching across
    the full landscape width. CSS-only — no game.js changes.
  */
  #game-container {
    width: 100vw;
    height: 100vh;
    max-width: calc(100vh * 480 / 800);
    max-height: calc(100vw * 800 / 480);
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div id="game-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
